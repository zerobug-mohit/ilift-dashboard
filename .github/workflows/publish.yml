name: Refresh dashboard from Drive

# The whole refresh, end to end: fetch the exports from Google Drive, compute
# every figure, publish the dashboard. Nobody needs R or Node installed — the
# person who maintains the data only ever touches the Drive folder.
#
# One-time setup is in README.md ("Refreshing from Google Drive"): a service
# account, two repository secrets, and Pages set to "GitHub Actions".

on:
  # The button: Actions → Refresh dashboard from Drive → Run workflow
  workflow_dispatch:

  # Safety net, so figures cannot go stale because someone forgot the button.
  # 06:00 UTC ≈ 11:30 IST.
  schedule:
    - cron: '0 6 * * *'

  # Keep the published site in step with code changes too.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          # Posit's package manager serves Linux binaries, turning a ~20 minute
          # source build of dplyr and friends into well under a minute.
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readxl
            any::jsonlite
            any::digest
            any::writexl
            any::testthat

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      # The suite exercises the metric logic against synthetic data, so it runs
      # before any real data is on the runner. A regression fails the job here
      # rather than after the figures have been published.
      - name: Run tests against fixtures
        run: |
          npm run fixtures
          npm run test

      # Replaces the fixtures with the real exports.
      - name: Fetch source workbooks from Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node scripts/fetch-drive.mjs

      - name: Compute every view and build the site
        run: node scripts/publish.mjs --base /${{ github.event.repository.name }}/

      # The runner holds beneficiary records from the moment the fetch step ran.
      # Delete them before anything is uploaded, so the only thing that can
      # reach the Pages artifact is the aggregate output in publish/.
      - name: Remove source data from the runner
        if: always()
        run: rm -rf backend/data/incoming

      # publish.mjs already refuses to continue if it finds beneficiary-shaped
      # identifiers. Re-checking here means a change to that script cannot
      # quietly disable the last guard before the files become public.
      - name: Verify only aggregates are being published
        run: |
          if grep -rlE 'IL[0-9]{5}' publish/ ; then
            echo "::error::Beneficiary identifiers found in publish/ — not deploying."
            exit 1
          fi
          echo "publish/ contains aggregates only"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
